name: Publish NuGet package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Megaraz.ResultPattern.slnx

      - name: Build
        run: dotnet build Megaraz.ResultPattern.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Megaraz.ResultPattern.slnx --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack Megaraz.ResultPattern/Megaraz.ResultPattern.csproj --configuration Release --no-build --no-restore --output artifacts

      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >
          ./.github/scripts/validate-package-version.ps1
          -Tag $env:RELEASE_TAG
          -ProjectPath Megaraz.ResultPattern/Megaraz.ResultPattern.csproj
          -PackageDirectory artifacts

      - name: Validate package contents
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: >
          ./.github/scripts/validate-package-contents.ps1
          -PackageDirectory artifacts
          -RepositoryCommit $env:RELEASE_COMMIT

      - name: Install Source Link verification tool
        run: dotnet tool install SourceLink --tool-path .tools --version 3.1.1

      - name: Verify Source Link symbols
        shell: pwsh
        run: |
          $symbolDirectory = Join-Path $env:RUNNER_TEMP "Megaraz.ResultPattern-symbols"
          try {
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            [System.IO.Compression.ZipFile]::ExtractToDirectory(
              (Resolve-Path artifacts/Megaraz.ResultPattern.*.snupkg),
              $symbolDirectory)
            Get-ChildItem -LiteralPath $symbolDirectory -Filter Megaraz.ResultPattern.pdb -Recurse |
              ForEach-Object { & ./.tools/sourcelink test $_.FullName }

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
          finally {
            Remove-Item -LiteralPath $symbolDirectory -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: NuGet login
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package
        run: |
          dotnet nuget push artifacts/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
          dotnet nuget push artifacts/*.snupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
